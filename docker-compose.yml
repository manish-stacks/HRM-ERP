version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hrm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hrm_erp_db
      MYSQL_USER: hrm_user
      MYSQL_PASSWORD: hrm_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hrm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://hrm_user:hrm_password@mysql:3306/hrm_erp_db"
      JWT_SECRET: "enterprise-hrm-jwt-secret-key-32-chars-minimum"
      JWT_REFRESH_SECRET: "enterprise-hrm-refresh-secret-key-minimum"
      CORS_ORIGIN: "http://localhost:5173"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrm-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:

